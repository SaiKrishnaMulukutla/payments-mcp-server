[project]
name = "bharat-connect-mcp"
version = "0.1.0"
description = "Single-owner, approval-gated Bharat Connect (BBPS) MCP server"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.28,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.5,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "cryptography>=43,<47",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payments_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/payments_mcp"]
