name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,redis,auth]"
      - name: Lint
        run: ruff check src evals tests
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest -q
